# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Generated by bootstrap 2026-11-07. Format: scripts/check.conf.example.
#
# Activated by spec 0001 (walking skeleton). ANEW scripts on macOS: run with dash
# (docs/conventions.md, Known traps).
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene) — what each step could leave:
#   ruff, mypy, lint-imports  one-shot processes; caches only. lint-imports cache off (--no-cache);
#                             mypy cache kept (build cache, not run data — never changes a verdict).
#   pytest                    in-process; TestClient runs the app in-process — no Uvicorn server is
#                             started. No pytest-xdist (no worker processes). -p no:cacheprovider so
#                             --lf/--ff state never carries into the next run. Data: each test gets a
#                             fresh :memory: SQLite DB — nothing reaches the next run (rule 5).
#   node --test               one child process per test file, all exit at the end; an open jsdom
#                             window keeps timers alive and hangs the run → tests call
#                             window.close(); --test-timeout bounds a hung file.
#   (none)                    no daemons, watchers, browsers, containers or dev servers in check.
# Determinism: TZ=UTC on every test step (docs/testing.md, Frameworks & layout).
# Split by selector, never by list: unit = -m "not integration", integration = -m integration.
#
# --- prerequisites ---
requires lint: .venv/bin/python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)"
requires format: .venv/bin/python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)"
requires types: .venv/bin/python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)"
requires architecture: .venv/bin/python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)"
requires unit: .venv/bin/python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)"
requires integration: .venv/bin/python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)"
requires frontend: node -e "process.exit(+process.versions.node.split('.')[0] >= 22 ? 0 : 1)"
#
# --- steps ---
lint [fast]: .venv/bin/python -m ruff check backend
format [fast]: .venv/bin/python -m ruff format --check backend
types [fast]: .venv/bin/python -m mypy --strict backend/app
# resource hygiene: no import-linter cache
architecture [fast]: PYTHONPATH=backend .venv/bin/lint-imports --no-cache
# resource hygiene: no pytest cache, no xdist workers
unit [fast]: TZ=UTC .venv/bin/python -m pytest -q -p no:cacheprovider --strict-markers -m "not integration" backend/tests
# resource hygiene: jsdom windows closed in tests; timeout bounds a hung file
frontend [fast]: TZ=UTC node --test --test-timeout=30000 "frontend/tests/**/*.test.js"
integration: TZ=UTC .venv/bin/python -m pytest -q -p no:cacheprovider --strict-markers -m integration backend/tests
