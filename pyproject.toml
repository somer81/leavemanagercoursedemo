[project]
name = "leave-manager"
version = "0.1.0"
description = "İzin Yöneticisi — ANEW kurs demosu"
requires-python = ">=3.13,<3.14"
# Major versions pinned here; exact versions live in requirements.lock (docs/conventions.md).
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
    "import-linter>=2.16,<3",
]

[tool.ruff]
target-version = "py313"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "backend"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
markers = [
    "integration: API → service → real SQLite; full profile only (docs/testing.md)",
]
